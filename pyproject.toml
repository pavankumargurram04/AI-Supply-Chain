[project]
name = "ai-supply-chain-enterprise"
version = "0.1.0"
description = "Integrated AI supply-chain decision intelligence platform"
requires-python = ">=3.11"

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring PostgreSQL and other external services",
]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers --strict-config"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["core", "db", "data_platform", "ml", "decision_engine", "agents"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true